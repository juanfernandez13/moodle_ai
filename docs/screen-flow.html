<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>Mapa de telas · Moodle AI</title>
  <link rel="icon" type="image/svg+xml" href="design-proposals/glass-owl-v4/assets/brand-owl-plain.svg">
  <link rel="stylesheet" href="design-proposals/glass-owl-v4/tailwind.css?v=tailwind-board-20261012">
  <link rel="stylesheet" href="screen-flow.css?v=tailwind-board-20261012">
  <script src="screen-flow.js?v=tailwind-board-20261012" defer></script>
</head>
<body class="m-0 bg-[var(--paper)] text-[15px] text-[var(--ink)]">
  <header class="flex h-[74px] items-center justify-between border-0 border-b border-solid border-[var(--line)] bg-[#fcfdfb] px-7 max-[720px]:h-auto max-[720px]:min-h-[74px] max-[720px]:items-start max-[720px]:gap-3 max-[720px]:px-[15px] max-[720px]:py-3">
    <a class="flex min-h-[44px] items-center gap-[11px] text-[19px] font-[650] text-[var(--ink)] no-underline max-[720px]:whitespace-nowrap max-[720px]:text-base" href="../design-system.html"><img class="max-[720px]:h-8 max-[720px]:w-8" src="design-proposals/glass-owl-v4/assets/brand-owl.svg" width="38" height="38" alt=""><span>Moodle AI <small class="mt-0.5 block text-[13px] font-normal text-[var(--muted)] max-[720px]:text-[11px]">Mapa de telas</small></span></a>
    <nav class="flex items-center gap-[22px] text-sm max-[720px]:flex-wrap max-[720px]:justify-end max-[720px]:gap-[9px] max-[720px]:text-[11px]" aria-label="Documentação"><a class="max-[720px]:hidden" href="SCREEN_FLOW.md">Fluxograma Mermaid</a><a class="inline-flex min-h-[44px] items-center rounded-xl bg-[var(--green)] px-[17px] py-3 text-white no-underline max-[720px]:px-3 max-[720px]:text-xs" href="design-proposals/glass-owl-v4/index.html">Abrir protótipo</a></nav>
  </header>
  <main class="px-[18px] max-[720px]:px-[10px]">
    <div class="flex items-center justify-between gap-[14px] py-3 max-[720px]:block max-[720px]:py-[9px]">
      <div class="map-tabs flex gap-[5px] rounded-[15px] bg-[#e8eee5] p-1 max-[720px]:grid max-[720px]:grid-cols-2 max-[720px]:gap-[3px]" role="tablist" aria-label="Jornadas do projeto">
        <button class="min-h-[44px] whitespace-nowrap rounded-xl border border-solid border-transparent bg-transparent px-[17px] font-semibold hover:border-[#7b9c81] aria-selected:border-[var(--line)] aria-selected:bg-white aria-selected:shadow-[0_2px_3px_#20392c0b] max-[1000px]:px-3 max-[720px]:px-[7px] max-[720px]:text-xs" id="tab-course" role="tab" aria-controls="map-panel" aria-selected="true" data-map="course">Curso · MVP</button>
        <button class="min-h-[44px] whitespace-nowrap rounded-xl border border-solid border-transparent bg-transparent px-[17px] font-semibold hover:border-[#7b9c81] aria-selected:border-[var(--line)] aria-selected:bg-white aria-selected:shadow-[0_2px_3px_#20392c0b] max-[1000px]:px-3 max-[720px]:px-[7px] max-[720px]:text-xs" id="tab-demo" role="tab" aria-controls="map-panel" aria-selected="false" tabindex="-1" data-map="demo">Protótipo atual</button>
        <button class="min-h-[44px] whitespace-nowrap rounded-xl border border-solid border-transparent bg-transparent px-[17px] font-semibold hover:border-[#7b9c81] aria-selected:border-[var(--line)] aria-selected:bg-white aria-selected:shadow-[0_2px_3px_#20392c0b] max-[1000px]:px-3 max-[720px]:px-[7px] max-[720px]:text-xs" id="tab-students" role="tab" aria-controls="map-panel" aria-selected="false" tabindex="-1" data-map="students">Alunos</button>
        <button class="min-h-[44px] whitespace-nowrap rounded-xl border border-solid border-transparent bg-transparent px-[17px] font-semibold hover:border-[#7b9c81] aria-selected:border-[var(--line)] aria-selected:bg-white aria-selected:shadow-[0_2px_3px_#20392c0b] max-[1000px]:px-3 max-[720px]:px-[7px] max-[720px]:text-xs" id="tab-dates" role="tab" aria-controls="map-panel" aria-selected="false" tabindex="-1" data-map="dates">Datas · Futuro</button>
      </div>
      <div class="legend flex gap-[13px] text-xs text-[var(--muted)] max-[1000px]:hidden" aria-label="Legenda de implementação"><span class="demo flex items-center gap-[6px]">Demo</span><span class="planned flex items-center gap-[6px]">Planejado</span><span class="future flex items-center gap-[6px]">Futuro</span></div>
    </div>
    <section id="map-panel" role="tabpanel" aria-labelledby="tab-course">
      <div class="flex items-center justify-between gap-[14px] px-0.5 pb-[11px] max-[720px]:block max-[720px]:pb-[9px]">
        <p class="m-0 max-w-[65ch] text-[13px] leading-[1.45] text-[var(--muted)] max-[1000px]:text-xs max-[720px]:mb-2" id="map-summary"></p>
        <div class="flex shrink-0 gap-[6px] max-[720px]:justify-end" role="group" aria-label="Visualização do mapa">
          <button class="min-h-[44px] rounded-[10px] border border-solid border-[var(--line)] bg-white px-3 hover:border-[#7b9c81] aria-pressed:border-[#92b698] aria-pressed:bg-[var(--demo)] max-[720px]:px-[15px]" id="board-view" aria-pressed="true">Quadro</button><button class="min-h-[44px] rounded-[10px] border border-solid border-[var(--line)] bg-white px-3 hover:border-[#7b9c81] aria-pressed:border-[#92b698] aria-pressed:bg-[var(--demo)] max-[720px]:px-[15px]" id="list-view" aria-pressed="false">Lista</button>
          <button class="min-h-[44px] rounded-[10px] border border-solid border-[var(--line)] bg-white px-3 hover:border-[#7b9c81] max-[720px]:px-[15px]" id="toggle-details" aria-expanded="true" aria-controls="screen-details">Detalhes</button>
        </div>
      </div>
      <div class="workspace grid h-[calc(100dvh-214px)] min-h-[420px] grid-cols-[minmax(0,1fr)_300px] gap-3 min-[1600px]:grid-cols-[minmax(0,1fr)_340px] max-[1000px]:grid-cols-[minmax(0,1fr)_270px] max-[720px]:relative max-[720px]:block max-[720px]:h-[calc(100dvh-264px)] max-[720px]:min-h-[390px]">
        <section class="board-region relative min-w-0 overflow-hidden rounded-[18px] border border-solid border-[#cdd9cb] bg-[#f9fbf6] shadow-[inset_0_0_70px_#e6eee337] max-[720px]:h-full" aria-label="Quadro visual de telas">
          <div id="viewport" tabindex="0" aria-label="Área do mapa. Setas movem o quadro; mais e menos ajustam o zoom; zero enquadra." aria-describedby="board-help">
            <div id="canvas"><svg id="connections" aria-hidden="true"></svg><div id="screens"></div></div>
          </div>
          <div class="absolute bottom-[34px] left-[14px] flex items-center gap-[3px] rounded-[13px] border border-solid border-[var(--line)] bg-white/95 p-1 shadow-[0_3px_9px_#20392c0b] max-[720px]:bottom-[39px] max-[720px]:left-[10px]" role="group" aria-label="Zoom e enquadramento"><button class="min-h-[44px] min-w-[44px] rounded-xl border-0 bg-transparent px-2 text-[22px] disabled:cursor-default disabled:opacity-50" id="zoom-out" aria-label="Diminuir zoom">−</button><output class="min-w-[44px] text-center text-xs" id="zoom-value" aria-label="Zoom atual">100%</output><button class="min-h-[44px] min-w-[44px] rounded-xl border-0 bg-transparent px-2 text-[22px] disabled:cursor-default disabled:opacity-50" id="zoom-in" aria-label="Aumentar zoom">+</button><button class="min-h-[44px] min-w-[44px] rounded-l-none rounded-r-lg border-0 border-l border-solid border-[var(--line)] bg-transparent px-[10px] text-xs" id="fit">Enquadrar</button></div>
          <p class="pointer-events-none absolute right-3 bottom-2 left-4 m-0 w-max max-w-[calc(100%-28px)] bg-[#f9fbf6d9] text-[11px] text-[#5e735e] max-[720px]:text-[10px]" id="board-help">Arraste o espaço vazio. Selecione uma tela para ver o caminho.</p>
        </section>
        <section id="screen-list" class="screen-list overflow-auto rounded-[18px] border border-solid border-[var(--line)] bg-[#fcfdfb] p-[18px] max-[720px]:h-full" aria-label="Lista acessível de telas" hidden></section>
        <aside class="min-w-0 overflow-auto rounded-[18px] border border-solid border-[var(--line)] bg-white px-5 py-[17px] min-[1600px]:px-[27px] min-[1600px]:py-[23px] max-[720px]:absolute max-[720px]:inset-y-0 max-[720px]:right-0 max-[720px]:z-[5] max-[720px]:w-[min(320px,100%)] max-[720px]:rounded-2xl max-[720px]:shadow-[-5px_0_22px_#243b2c12]" id="screen-details" aria-labelledby="detail-title">
          <div class="mb-[5px] flex items-center justify-between text-[13px] text-[var(--muted)]"><span class="font-[650]" id="detail-id"></span><button class="min-h-[44px] min-w-[44px] rounded-xl border-0 bg-transparent text-[22px]" id="close-details" aria-label="Fechar detalhes">×</button></div>
          <h1 class="m-0 mb-[10px] text-2xl leading-[1.17] font-[650] tracking-[-0.5px]" id="detail-title"></h1><p class="m-0 mb-[13px] inline-block" id="detail-status"></p><p class="m-0 text-sm leading-[1.55] text-[#485f4e]" id="detail-summary"></p>
          <dl class="mt-[18px] mb-4 border-0 border-t border-solid border-[#e0e8dc] pt-4" id="detail-fields"></dl>
          <div id="detail-next"></div>
          <a class="mt-[19px] inline-block text-xs" href="SCREEN_FLOW.md">Consultar o fluxo completo</a>
        </aside>
      </div>
    </section>
    <footer class="flex justify-between gap-4 px-[3px] py-[10px] text-[11px] leading-[1.4] text-[#697b6b] max-[720px]:block max-[720px]:px-0.5 max-[720px]:text-[10px]"><span>Planejamento e protótipo local. Nenhum pacote MBZ é gerado nesta demo.</span><a class="max-[720px]:mt-1 max-[720px]:inline-block" href="PLANNING_READINESS.md">O que falta no planejamento</a></footer>
    <p id="map-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
